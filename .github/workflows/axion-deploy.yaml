name: deploy to akss

on:
 # workflow_dispatch:
 workflow_run: 
  workflows: ["build and deploy"]
  types: 
   - completed

permissions:
   id-token: write
   contents: write

jobs:
  deploy: 
   runs-on: ubuntu-latest

   steps:
     - name: checkout code
       uses: actions/checkout@v4
       with:
        token: ${{ secrets.GITHUB_TOKEN }}
     - name: Update image tag in deployment
       run: |
        TAG=${{ github.run_number }}

        sed -i "s|image: acr222.azurecr.io/datasimulator:.*|image: acr222.azurecr.io/datasimulator:$TAG|" manifest/templates/datasimulator.yaml

     - name: Commit deployment change
       run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add manifest/templates/datasimulator.yaml
        git commit -m "Update image tag to ${{ github.run_number }}" || echo "No changes"
        git push
