name: build and deploy

on:
 workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
   # environment: azure-new
   runs-on: ubuntu-latest

   steps:

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
         python -m pip install --upgrade pip
         pip install -r requirements.txt       
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Axion'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: dependency-check-report        
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL}}
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: d58ad8cb-015b-4d02-ae02-f997b0139a08
          tenant-id: 90dd04ee-72ca-46cd-8662-0d614e24d498
          subscription-id: 933094f8-3653-44a5-b6f6-04a0992bcf41
          
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group RG22 \
            --name  KC100 \
            --overwrite-existing

      - name: Check AKS
        run: |
          kubectl get nodes

      - name: Helm Upgrade
        run: |
          helm upgrade --install axion ./manifest \
            --namespace axiom22 \
            --create-namespace       
  
