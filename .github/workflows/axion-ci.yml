name: build and push

on:
 workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
   environment: azure-new
   runs-on: ubuntu-latest

   steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group RG22 \
            --name  KC100 \
            --overwrite-existing

      - name: Check AKS
        run: |
          kubectl get nodes

      - name: Helm Upgrade
        run: |
          helm upgrade --install axion ./manifest \
            --namespace axiom22 \
            --create-namespace       
  
