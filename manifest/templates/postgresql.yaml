apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name}}-postgres
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name}}-postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name}}-postgres
 
    spec:
      containers:
      - name: {{ .Release.Name}}-postgres
        image: postgres:17.10

        ports:
        - containerPort: 5432

        env:
       # - name: POSTGRES_USER
      #    value: "{{ .Release.Name }}-postgres"

  #      - name: POSTGRES_USER
   #       value: "5432"

        - name: POSTGRES_DB
          value: "axion_db"

        - name: POSTGRES_USER
          value: "admin"


 #       envFrom:
  #      - configMapRef:
   #        name: {{ .Release.Name }}-postgres-config

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-secret
              key: POSTGRES_PASSWORD


